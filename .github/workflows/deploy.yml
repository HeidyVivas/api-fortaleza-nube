name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Auditoría de dependencias (npm audit)
        run: npm audit --audit-level=high

      - name: Construir imagen Docker
        run: docker build -t api-fortaleza-nube .

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-fortaleza-nube'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  deploy:
    needs: security-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a EC2 vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            git pull origin main
            docker stop api-fortaleza-nube || true
            docker rm api-fortaleza-nube || true
            docker build -t api-fortaleza-nube .
            docker run -d -p 8080:8080 --name api-fortaleza-nube --restart unless-stopped api-fortaleza-nube